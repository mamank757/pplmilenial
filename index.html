<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* Tambahkan ini di dalam tag <style> */
.hidden { display: none !important; }

:root{
    --bg:#020617;
    --card:rgba(255,255,255,0.06);
    --glass:rgba(255,255,255,0.08);
    --primary:#22c55e;
    --accent:#4ade80;
    --text:#e5e7eb;
    --muted:#94a3b8;
}

/* GLOBAL */
body{
    font-family:'Inter',sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color:var(--text);
}

/* HEADER HERO */
header{
    padding:50px 20px 30px;
    text-align:center;
    background: linear-gradient(135deg, rgba(34,197,94,0.1), transparent);
}

header h1{
    font-size:2rem;
    font-weight:700;
    background: linear-gradient(90deg,#22c55e,#4ade80);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

header p{
    font-size:0.9rem;
    color:var(--muted);
}

/* SEARCH GLASS */
.search-box{
    max-width:500px;
    margin:20px auto;
    position:relative;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:14px 15px 14px 45px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.08);
    background:var(--glass);
    backdrop-filter:blur(10px);
    color:white;
    transition:0.3s;
}

.search-box input:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 2px rgba(34,197,94,0.2);
}

.search-box i{
    position:absolute;
    left:32px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
    padding:25px;
    max-width:1100px;
    margin:auto;
}

/* CARD GLASS */
.card{
    background:var(--card);
    border-radius:18px;
    padding:18px;
    display:flex;
    gap:15px;
    align-items:center;
    text-decoration:none;
    color:white;
    position:relative;
    border:1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    transition:all 0.3s ease;
}

/* HOVER EFFECT */
.card:hover{
    transform:translateY(-6px) scale(1.02);
    border-color:var(--primary);
    box-shadow:0 10px 30px rgba(34,197,94,0.2);
}

/* ICON BOX */
.card i{
    font-size:1.3rem;
    color:var(--primary);
    background:rgba(34,197,94,0.1);
    padding:12px;
    border-radius:12px;
}

/* TEXT */
.card span{
    font-size:0.9rem;
    line-height:1.4;
}

/* BADGE */
.badge{
    position:absolute;
    top:10px;
    right:10px;
    font-size:0.65rem;
    padding:4px 9px;
    border-radius:999px;
    background:linear-gradient(135deg,#22c55e,#4ade80);
    color:black;
    font-weight:600;
}

/* SEPARATOR */
.separator{
    grid-column:1/-1;
    margin-top:35px;
    margin-bottom:10px;
    font-size:0.8rem;
    font-weight:600;
    color:var(--accent);
    letter-spacing:1px;
    border-left:3px solid var(--primary);
    padding-left:10px;
}
/* Menghilangkan margin atas untuk separator pertama agar terlihat rapi */
.grid .separator:first-child {
    margin-top: 0;
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px 20px;
    font-size:0.8rem;
    color:var(--muted);
}
</style>
</head>

<body>

<header>
